<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImobiAI - Login Administrativo</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-card { max-width: 400px; margin: 100px auto; padding: 30px; background: #2d3748; border-radius: 8px; border: 1px solid #4a5568; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #a0aec0; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; background: #1a202c; border: 1px solid #4a5568; border-radius: 4px; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background: #2b6cb0; }
        .error-msg { color: #e53e3e; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body style="background: #1a202c; font-family: sans-serif; color: white;">

    <div class="login-card">
        <h2 style="text-align: center; margin-top: 0; color: #4299e1; margin-bottom: 5px;">Imobi<span>AI</span></h2>
        <p style="text-align: center; font-size: 0.85rem; color: #a0aec0; margin-bottom: 25px;">Painel de Controle Restrito</p>

        {% if error %}
            <div class="error-msg">❌ {{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required placeholder="Digite o usuário">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="/" style="font-size: 0.8rem; color: #718096; text-decoration: none;">← Voltar para o site</a>
        </div>
    </div>

</body>
</html>
